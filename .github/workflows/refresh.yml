name: refresh-data
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/build.py
      - name: commit data + usage log
        run: |
          git config user.name "mf-dashboard-bot"; git config user.email "actions@users.noreply.github.com"
          git add data.json usage/usage.jsonl
          git commit -m "data refresh $(date -u +%FT%TZ) [skip ci]" || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: "."}
      - id: deployment
        uses: actions/deploy-pages@v4
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
